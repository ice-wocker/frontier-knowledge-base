name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  schedule:
    # 外链会随时间腐烂，即使仓库没动也要定期体检
    - cron: '0 3 * * 1'

jobs:
  index:
    name: 校验 INDEX.md 是否为最新
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check INDEX.md
        run: python3 scripts/gen_index.py --check

  docs:
    name: 内容质量校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # 校验每篇是否覆盖必备内容槽位、来源是否够、日期/标题有无异常。
      # 这管的是「里面写的东西还成立吗」，与外链检查互补。
      - name: Check docs
        run: python3 scripts/check_docs.py

  site:
    name: 校验站点能否构建 + 产物自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # 站点是 docs/ 的投影，构建失败必须在 PR 阶段就暴露，
      # 而不是等合并后 Pages 发布挂掉。
      - name: Build site
        run: python3 scripts/build_site.py
      # 构建成功不等于站点可用：站内链接、索引 docId、sitemap 同源都要验。
      - name: Check site artifacts
        run: python3 scripts/check_site.py
      - name: Assert output
        run: |
          test -f site/index.html
          test -f site/search-index.json
          test -f site/docs.json
          pages=$(find site -name '*.html' | wc -l)
          echo "生成 HTML 页面数: $pages"
          test "$pages" -gt 160

  links:
    name: 外链可达性检查
    runs-on: ubuntu-latest
    # 4000+ 条外链，全量跑很久；PR 上抽样，定时任务全量
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Collect link stats
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location("cl", "scripts/check_links.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          urls = m.collect_urls()
          print(f"文档数: {len(list(pathlib.Path('docs').rglob('*.md')))}")
          print(f"唯一外链: {len(urls)}")
          PY

      # 定时任务：全量检查（--limit 0 表示不限制）
      - name: Check all links (scheduled)
        if: github.event_name == 'schedule'
        run: python3 scripts/check_links.py --timeout 20 --workers 24

      # PR / push：抽样检查，保证反馈足够快
      - name: Check sample links
        if: github.event_name != 'schedule'
        run: python3 scripts/check_links.py --limit 300 --timeout 15 --workers 24
