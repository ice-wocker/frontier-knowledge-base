name: Deploy site

# 把 docs/ 渲染成静态站点并发布到 GitHub Pages。
# 站点是 docs/ 的投影，唯一真相源仍是 Markdown。
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/build_site.py'
      - 'scripts/kb.py'
      - 'scripts/check_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个发布，避免两个 commit 抢 Pages 锁
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static site
        run: python3 scripts/build_site.py
      # 宁可不上线，也不让坏产物出去：站内链接 / 索引 / sitemap 都要验。
      - name: Check site artifacts
        run: python3 scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
